<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/bootstrap.min.css}"
          href="../css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
    <style>
        .container {
            max-width: 560px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="py-5 text-center">
        <h2>로그인</h2>
    </div>

    <form action="" th:object="${user}" method="post">
        <!-- 이메일 -->
        <div>
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="${email}" class="form-control" placeholder="이메일 입력">
        </div>

        <!-- 비밀번호 -->
        <div>
            <label for="password">이메일</label>
            <input type="password" id="password" th:field="${password}" class="form-control" placeholder="비밀번호 입력">
        </div>
    </form>
</div>



</body>
</html>
